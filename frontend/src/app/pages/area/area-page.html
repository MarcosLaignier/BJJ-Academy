<div class="area-shell">
  <aside>
    <img src="/fenix.jpg" alt="" />
    <strong>Fênix Jiu-Jitsu</strong>
    <nav>
      <a routerLink="/area" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <i class="bi bi-grid"></i> Visão geral
      </a>
      <span><i class="bi bi-people"></i> Alunos <small>em breve</small></span>
      @if (podeGerenciarPerfis()) {
        <a routerLink="/area/perfis" routerLinkActive="active">
          <i class="bi bi-shield-lock"></i> Perfis de acesso
        </a>
      }
    </nav>
  </aside>

  <main>
    <header>
      <div>
        <small>{{ auth.sessao()?.perfil }}</small>
        <strong>{{ auth.sessao()?.nome }}</strong>
      </div>
      <button class="btn btn-outline-dark" type="button" (click)="sair()">
        Sair <i class="bi bi-box-arrow-right"></i>
      </button>
    </header>

    <router-outlet />
  </main>
</div>
