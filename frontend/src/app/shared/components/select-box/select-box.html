<label>
  <span>{{ label() }}</span>
  <select class="form-select" [disabled]="disabled" [value]="value" (change)="update($event)">
    <option value="">{{ emptyLabel() }}</option>
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</label>
